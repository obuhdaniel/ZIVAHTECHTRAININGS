<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nigerian Dishes Menu</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #fdf6e3; }
    header { text-align: center; margin-bottom: 30px; position: relative; }
    header h1 { font-size: 2rem; margin-bottom: 4px; color: #2e7d32; }
    header p { color: #666; }
    h2 { font-size: 1.3rem; border-bottom: 2px solid #2e7d32; padding-bottom: 4px; margin-top: 30px; color: #1b5e20; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #ccc; }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; }
    .item-desc { font-size: 0.85rem; color: #666; }
    .item-right { display: flex; align-items: center; gap: 12px; }
    .item-price { font-weight: 700; color: #e65100; white-space: nowrap; }
    .add-btn { background: #2e7d32; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .add-btn:hover { background: #1b5e20; }
    .add-btn:active { transform: scale(0.95); }

    /* Cart button */
    #cart-btn { position: fixed; top: 20px; right: 20px; background: #e65100; color: #fff; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.25); z-index: 100; }
    #cart-btn:hover { background: #bf360c; }
    #cart-badge { position: absolute; top: -4px; right: -4px; background: #d32f2f; color: #fff; font-size: 0.7rem; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }

    /* Overlay */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; }
    #overlay.open { display: block; }

    /* Cart panel */
    #cart-panel { position: fixed; top: 0; right: -420px; width: 400px; max-width: 90vw; height: 100%; background: #fff; box-shadow: -2px 0 12px rgba(0,0,0,0.2); z-index: 300; display: flex; flex-direction: column; transition: right 0.3s ease; }
    #cart-panel.open { right: 0; }
    #cart-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; }
    #cart-header h2 { margin: 0; border: none; font-size: 1.2rem; color: #1b5e20; }
    #close-cart { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #666; }
    #cart-items { flex: 1; overflow-y: auto; padding: 12px 20px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 600; font-size: 0.95rem; }
    .cart-item-price { font-size: 0.8rem; color: #e65100; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 28px; height: 28px; border: 1px solid #ccc; background: #f5f5f5; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .qty-btn:hover { background: #e0e0e0; }
    .qty-val { font-weight: 600; min-width: 20px; text-align: center; }
    .remove-btn { background: none; border: none; color: #d32f2f; cursor: pointer; font-size: 0.8rem; margin-left: 8px; }
    .remove-btn:hover { text-decoration: underline; }
    #cart-empty { text-align: center; color: #999; padding: 40px 0; }
    #cart-footer { padding: 16px 20px; border-top: 2px solid #eee; }
    #cart-total { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
    #clear-cart { background: none; border: 1px solid #d32f2f; color: #d32f2f; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; margin-right: 8px; }
    #clear-cart:hover { background: #fdecea; }
    #place-order { background: #2e7d32; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 0.95rem; font-weight: 600; flex: 1; }
    #place-order:hover { background: #1b5e20; }
    #cart-footer-btns { display: flex; gap: 8px; }

    /* Toast */
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; z-index: 400; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>Restaurant Name</h1>
    <p id="location">Loading menu...</p>
  </header>

  <button id="cart-btn" onclick="openCart()">
    🛒
    <span id="cart-badge" style="display:none">0</span>
  </button>

  <div id="overlay" onclick="closeCart()"></div>
  <div id="cart-panel">
    <div id="cart-header">
      <h2>Your Order</h2>
      <button id="close-cart" onclick="closeCart()">&times;</button>
    </div>
    <div id="cart-items"></div>
    <div id="cart-footer">
      <div id="cart-total"><span>Total:</span><span id="total-val">₦0</span></div>
      <div id="cart-footer-btns">
        <button id="clear-cart" onclick="clearCart()">Clear All</button>
        <button id="place-order" onclick="placeOrder()">Place Order</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="menu"></div>

  <script>
    const STORAGE_KEY = 'naija_cart';
    let menuData = {};

    function getCart() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveCart(cart) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
      updateBadge();
      renderCartItems();
    }

    function parsePrice(str) {
      return parseInt(str.replace(/[^\d]/g, ''), 10);
    }

    function formatPrice(num) {
      return '₦' + num.toLocaleString();
    }

    function addToCart(name, price) {
      const cart = getCart();
      const existing = cart.find(i => i.name === name);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ name, price, quantity: 1 });
      }
      saveCart(cart);
      showToast(`${name} added to cart`);
    }

    function changeQty(name, delta) {
      const cart = getCart();
      const item = cart.find(i => i.name === name);
      if (!item) return;
      item.quantity += delta;
      if (item.quantity <= 0) {
        const idx = cart.indexOf(item);
        cart.splice(idx, 1);
      }
      saveCart(cart);
    }

    function removeFromCart(name) {
      const cart = getCart().filter(i => i.name !== name);
      saveCart(cart);
    }

    function clearCart() {
      saveCart([]);
    }

    function updateBadge() {
      const cart = getCart();
      const count = cart.reduce((sum, i) => sum + i.quantity, 0);
      const badge = document.getElementById('cart-badge');
      if (count > 0) {
        badge.style.display = 'flex';
        badge.textContent = count;
      } else {
        badge.style.display = 'none';
      }
    }

    function renderCartItems() {
      const cart = getCart();
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('total-val');

      if (cart.length === 0) {
        container.innerHTML = '<div id="cart-empty">Your cart is empty</div>';
        totalEl.textContent = '₦0';
        return;
      }

      container.innerHTML = cart.map(i => {
        const sub = parsePrice(i.price) * i.quantity;
        return `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${i.name}</div>
              <div class="cart-item-price">${i.price} &times; ${i.quantity} = ${formatPrice(sub)}</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty('${i.name}', -1)">&minus;</button>
              <span class="qty-val">${i.quantity}</span>
              <button class="qty-btn" onclick="changeQty('${i.name}', 1)">+</button>
              <button class="remove-btn" onclick="removeFromCart('${i.name}')">✕</button>
            </div>
          </div>`;
      }).join('');

      const total = cart.reduce((sum, i) => sum + parsePrice(i.price) * i.quantity, 0);
      totalEl.textContent = formatPrice(total);
    }

    function openCart() {
      document.getElementById('cart-panel').classList.add('open');
      document.getElementById('overlay').classList.add('open');
      renderCartItems();
    }

    function closeCart() {
      document.getElementById('cart-panel').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }

    function placeOrder() {
      const cart = getCart();
      if (cart.length === 0) {
        showToast('Your cart is empty');
        return;
      }
      const total = cart.reduce((sum, i) => sum + parsePrice(i.price) * i.quantity, 0);
      const summary = cart.map(i => `${i.name} x${i.quantity}`).join(', ');
      alert(`Order placed!\n\n${summary}\n\nTotal: ${formatPrice(total)}\n\nThank you!`);
      clearCart();
      closeCart();
    }

    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        menuData = data;
        document.querySelector('header h1').textContent = data.restaurant;
        document.getElementById('location').textContent = data.location;
        const menuEl = document.getElementById('menu');
        menuEl.innerHTML = Object.entries(data.menu)
          .map(([category, items]) => `
            <h2>${category}</h2>
            ${items.map(i => `
              <div class="item">
                <div class="item-info">
                  <div class="item-name">${i.name}</div>
                  <div class="item-desc">${i.description}</div>
                </div>
                <div class="item-right">
                  <div class="item-price">${i.price}</div>
                  <button class="add-btn" onclick="addToCart('${i.name}', '${i.price}')">+ Add</button>
                </div>
              </div>
            `).join('')}
          `).join('');
        updateBadge();
      })
      .catch(() => { document.getElementById('menu').textContent = 'Failed to load menu.'; });
  </script>
</body>
</html>
